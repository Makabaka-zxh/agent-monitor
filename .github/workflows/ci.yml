name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-web:
    name: Python and Web (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            requirements-tested.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Python dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Test Python service and portable Mac scripts
        run: python -m pytest -q tests macos/scripts
      - name: Install browser test dependency
        run: npm install --no-save --package-lock=false playwright@1.55.0
      - name: Install Chromium and Linux dependencies
        if: runner.os == 'Linux'
        run: npx playwright install --with-deps chromium
      - name: Install Chromium on Windows
        if: runner.os == 'Windows'
        run: npx playwright install chromium
      - name: Select the test Python for QR fixtures
        run: python -c "import os,sys; open(os.environ['GITHUB_ENV'],'a',encoding='utf-8').write('QR_PYTHON='+sys.executable+'\n')"
      - name: Test Web interactions
        run: node tests/test_ui_async.cjs

  android:
    name: Android development build and offline checks
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install the required SDK platform and build tools
        shell: pwsh
        run: |
          sdkmanager 'platforms;android-36.1' 'build-tools;36.1.0'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build with an ephemeral development signature
        shell: pwsh
        run: |
          $env:MONITOR_KEYSTORE = ''
          $env:MONITOR_KEY_ALIAS = ''
          $env:MONITOR_KEYSTORE_PASSWORD = ''
          $env:MONITOR_KEY_PASSWORD = ''
          ./android/build.ps1
      # CI does not upload signed packages or create releases.

  macos:
    name: macOS Swift tests
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Test the native Swift package
        run: xcrun swift test --package-path macos
